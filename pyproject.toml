[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
authors = [
    { name = "Hieu", email = "hieu.buinguyen2352001@gmail.com" }
]
name = "chatbone"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.2",
    "redis>=6.2.0",
    #    "aiofiles>=24.1.0",
    #    "aiohttp>=3.12.13",
    #    "alembic>=1.15.1",
    #    "argon2-cffi>=23.1.0",
    #    "asyncpg>=0.30.0",
    #    "black>=25.1.0",
    #    "cloudpickle>=3.1.1",
    #    "cryptography>=44.0.2",
    #    "fastapi[standard]==0.115.12",
    #    "fastmcp>=2.2.0",
    #    "filetype>=1.2.0",
    #    "flet-audio>=0.1.0",
    #    "flet-toast>=0.6.0",
    #    "flet[all]>=0.28.3",
    #    "ft>=1.0.0",
    #    "ipywidgets>=8.1.5",
    #    "loguru>=0.7.3",
    #    "miniopy-async>=1.23.0",
    #    "notebook>=7.3.2",
    #    "pipreqs>=0.5.0",
    #    "pwdlib[argon2]>=0.2.1",
    #    "pydantic-settings>=2.9.1",
    #    "pyjwt>=2.10.1",
    #    "pytest>=8.3.5",
    #    "pytest-asyncio>=0.25.3",
    #    "pytest-env>=1.1.5",
    #    "ray[serve]>=2.46",
    #    "redis>=4.6.0",
    #    "redis-purse>=2.0.2",
    #    "sqlalchemy[asyncio]>=2.0.38",
    #    "tqdm>=4.67.1",
    #    "uuid7>=0.1.0",
    #    "uvloop>=0.21.0",
    #    "viztracer>=1.0.2",
    #    "wheel>=0.45.1",
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
    "flet[all]>=0.28.3",
    "black>=25.1.0",
    "datastore",
    "auth",
    "utilities",
    "sdk",
    "assistants",
    "langchain-google-genai>=2.1.6",
    "pydantic>=2.11.7",
    "langchain-mcp-adapters>=0.1.8",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

#[tool.setuptools]
#include-package-data = true # default
#py-modules=["fake_app"]

#[tool.setuptools.package-dir]
#examples = "/examples"
#myproj.algorithms = "algorithms"
#myproj.configs = "configs"


[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
asyncio_mode = "strict"
testpaths = "tests"
addopts = "-v"


markers = [
    "unit", "auth", "utils", "repo", "workflows"
]
env = [
    #    "LOGURU_LEVEL=INFO",
    "LOGURU_LEVEL=DEBUG",
]

[tool.uv.workspace]
members = [ "utilities","datastore", "auth", "sdk", "assistants"]
#
[tool.uv.sources]
utilities = {workspace = true}
datastore = {workspace = true}
auth = {workspace = true}
sdk = {workspace=true}
assistants = {workspace=true}

[project.scripts]
chatbonectl = "chatbone_apps.main:main"
