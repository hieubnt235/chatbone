# This file was generated using the `serve build` command on Ray v2.47.0.
#  serve build auth:app datastore:app chatbone:app dummy:app -o ./deployments/compose/serve.yaml
# serve run deployments/compose/serve.yaml

proxy_location: EveryNode

http_options:
    
    host: 0.0.0.0
    
    port: 9999

grpc_options:
    
    port: 9998
    
    grpc_servicer_functions: [ ]

logging_config:
    
    encoding: TEXT
    
    log_level: INFO
    
    logs_dir: null
    
    enable_access_log: true
    
    additional_log_standard_attrs: [ ]

applications:
-   name: chatbone

    route_prefix: /

    import_path: chatbone:app

    runtime_env: { }

    deployments:

    -   name: Chatbone
        num_replicas: 1
        ray_actor_options:
            num_cpus: 1

-   name: dummy

    route_prefix: null

    import_path: dummy:app

    runtime_env: { }

    deployments:

    -   name: <Chatbone_Assistant>DummyAssistant<Chatbone_Assistant>
        num_replicas: 1
        ray_actor_options:
            num_cpus: 1
