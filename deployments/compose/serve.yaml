# This file was generated using the `serve build` command on Ray v2.47.0.
#  serve build auth:app datastore:app chatbone:app dummy:app -o ./deployments/compose/serve.yaml
# serve run deployments/compose/serve.yaml

proxy_location: EveryNode

http_options:
    
    host: 0.0.0.0
    
    port: 8000

grpc_options:
    
    port: 9000
    
    grpc_servicer_functions: [ ]

logging_config:
    
    encoding: TEXT
    
    log_level: INFO
    
    logs_dir: null
    
    enable_access_log: true
    
    additional_log_standard_attrs: [ ]

applications:

-   name: auth

    route_prefix: /auth

    import_path: auth:app

    runtime_env: { }

    deployments:

    -   name: Auth
        num_replicas: 2
        ray_actor_options:
            num_cpus: 0.5

-   name: datastore

    route_prefix: /datastore

    import_path: datastore:app

    runtime_env: { }

    deployments:

    -   name: Datastore
        num_replicas: 2
        ray_actor_options:
            num_cpus: 0.5

